<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 300" role="img" aria-labelledby="tglTitle tglDesc">
  <title id="tglTitle">PDMN Virtual Office — a destination for business, ideas &amp; connection</title>
  <desc id="tglDesc">Horizontal lockup: a doorway mark with a path rising through it, beside the words PDMN VIRTUAL OFFICE and the line "a destination for business, ideas and connection".</desc>

  <defs>
    <linearGradient id="tglPath" x1="18" y1="274" x2="290" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C0392B"/>
      <stop offset=".55" stop-color="#D2691E"/>
      <stop offset="1" stop-color="#C1502E"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(0,10)">
    <path d="M22 262 V30 H258 V262" fill="none" stroke="#2B2B2B" stroke-width="20" stroke-linejoin="miter"/>
    <path d="M78 238 V78 H210 V238" fill="none" stroke="#8A8A8A" stroke-width="9" stroke-linejoin="miter"/>
    <circle cx="143" cy="137" r="11" fill="#BE7D3E"/>
    <path d="M18 264 H118 C205 264 245 226 281 168" fill="none" stroke="url(#tglPath)"
          stroke-width="26" stroke-linecap="round"/>
    <path d="M264 190 L289 145 L305 180" fill="none" stroke="#A02128"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="404" y="118" fill="#8A8A8A"
        font-family="Montserrat, Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="42" font-weight="600" letter-spacing="16">THE</text>

  <text x="400" y="216" fill="#2B2B2B"
        font-family="Montserrat, Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" letter-spacing="8">GROUNDS</text>

  <text x="404" y="276" fill="#8A8A8A"
        font-family="Montserrat, Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="500" letter-spacing="3.4">A DESTINATION FOR BUSINESS, IDEAS &amp; CONNECTION.</text>
</svg>
