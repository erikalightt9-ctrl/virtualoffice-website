<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="tgmTitle tgmDesc">
  <title id="tgmTitle">PDMN Virtual Office</title>
  <desc id="tgmDesc">A doorway drawn as nested frames with a handle, and a path sweeping in from the ground and rising up through it.</desc>

  <defs>
    <linearGradient id="tgPath" x1="18" y1="264" x2="290" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C0392B"/>
      <stop offset=".55" stop-color="#D2691E"/>
      <stop offset="1" stop-color="#C1502E"/>
    </linearGradient>
  </defs>

  <!-- Outer doorway. Open at the foot, where the path enters. -->
  <path d="M22 262 V30 H258 V262" fill="none" stroke="#2B2B2B" stroke-width="20" stroke-linejoin="miter"/>

  <!-- Inner frame -->
  <path d="M78 238 V78 H210 V238" fill="none" stroke="#8A8A8A" stroke-width="9" stroke-linejoin="miter"/>

  <!-- Handle -->
  <circle cx="143" cy="137" r="11" fill="#BE7D3E"/>

  <!-- The path: along the ground, then rising -->
  <path d="M18 264 H118 C205 264 245 226 281 168" fill="none" stroke="url(#tgPath)"
        stroke-width="26" stroke-linecap="round"/>

  <!-- Arrowhead -->
  <path d="M264 190 L289 145 L305 180" fill="none" stroke="#A02128"
        stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
