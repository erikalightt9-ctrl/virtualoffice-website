<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" role="img" aria-labelledby="title desc">
  <title id="title">CAPSULE</title>
  <desc id="desc">Capsule wordmark with an orbital C and subtle dragon-red motion curve</desc>

  <!-- Primary C: an open capsule and a gateway beyond boundaries. -->
  <path d="M177 73A72 72 0 1 0 177 167" fill="none" stroke="#07111F" stroke-width="22" stroke-linecap="round"/>

  <!-- Silver orbit: connection, mobility and expanding opportunity. -->
  <ellipse cx="119" cy="120" rx="99" ry="50" fill="none" stroke="#9DA9B5" stroke-width="4" transform="rotate(-23 119 120)"/>
  <circle cx="209" cy="82" r="6" fill="#4B2A68"/>

  <!-- Dragon-red curve: protection and ambition, intentionally abstract. -->
  <path d="M45 163C65 187 101 198 134 189c25-7 45-23 56-44" fill="none" stroke="#B5121B" stroke-width="8" stroke-linecap="round"/>
  <path d="m182 151 10-22 7 18 18-4-16 17" fill="none" stroke="#B5121B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geometric wordmark. -->
  <text x="235" y="149" fill="#07111F" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="600" letter-spacing="17">APSULE</text>
  <rect x="239" y="174" width="720" height="1.5" fill="#C9D1D9"/>
  <text x="239" y="207" fill="#4D5B68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="3.7">YOUR SPACE. YOUR BUSINESS. BEYOND BOUNDARIES.</text>
</svg>
